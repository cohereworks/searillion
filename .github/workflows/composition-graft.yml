name: composition-graft

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/composition_graft.py"
      - ".github/workflows/composition-graft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { algorithm: filter, n: 5 }
          - { algorithm: filter, n: 6 }
          - { algorithm: graft, n: 5 }
          - { algorithm: graft, n: 6 }
          - { algorithm: graft, n: 7 }
          - { algorithm: graft, n: 8 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Compare composition construction
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/composition_graft.py \
            --algorithm ${{ matrix.algorithm }} \
            --n ${{ matrix.n }} \
            --output artifacts/composition-${{ matrix.algorithm }}-${{ matrix.n }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"algorithm":"%s","n":%s}\n' \
              "${{ matrix.algorithm }}" "${{ matrix.n }}" \
              >> artifacts/composition-${{ matrix.algorithm }}-${{ matrix.n }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: composition-${{ matrix.algorithm }}-${{ matrix.n }}
          path: artifacts/
