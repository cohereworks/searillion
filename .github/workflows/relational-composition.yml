name: relational-composition

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/relational_composition.py"
      - ".github/workflows/relational-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-functions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Composition benchmark
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/relational_composition.py \
            --n ${{ matrix.n }} \
            --output artifacts/composition-${{ matrix.n }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"n":%s}\n' \
              "${{ matrix.n }}" >> artifacts/composition-${{ matrix.n }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: composition-${{ matrix.n }}
          path: artifacts/
