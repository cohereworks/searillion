name: composition-families

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/composition_graft.py"
      - ".github/workflows/composition-families.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { algorithm: row-graft, family: bijections, n: 5 }
          - { algorithm: row-graft, family: bijections, n: 8 }
          - { algorithm: row-graft, family: bijections, n: 9 }
          - { algorithm: row-graft, family: single-edge, n: 9 }
          - { algorithm: row-graft, family: single-edge, n: 12 }
          - { algorithm: row-graft, family: unrestricted, n: 4 }
          - { algorithm: row-graft, family: unrestricted, n: 5 }
          - { algorithm: graft, family: bijections, n: 5 }
          - { algorithm: graft, family: single-edge, n: 9 }
          - { algorithm: graft, family: unrestricted, n: 4 }

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Composition family control
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/composition_graft.py \
            --algorithm ${{ matrix.algorithm }} \
            --family ${{ matrix.family }} \
            --n ${{ matrix.n }} \
            --output artifacts/family-${{ matrix.family }}-${{ matrix.algorithm }}-${{ matrix.n }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"algorithm":"%s","family":"%s","n":%s}\n' \
              "${{ matrix.algorithm }}" "${{ matrix.family }}" "${{ matrix.n }}" \
              >> artifacts/family-${{ matrix.family }}-${{ matrix.algorithm }}-${{ matrix.n }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: family-${{ matrix.family }}-${{ matrix.algorithm }}-${{ matrix.n }}
          path: artifacts/
