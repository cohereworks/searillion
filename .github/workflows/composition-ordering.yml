name: composition-ordering

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/composition_ordering.py"
      - ".github/workflows/composition-ordering.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordering:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [5, 6]
        strategy:
          - signature-major
          - row-block-rst
          - witness-first
          - target-first
          - middle-first

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Composition ordering benchmark
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/composition_ordering.py \
            --n ${{ matrix.n }} \
            --strategy ${{ matrix.strategy }} \
            --output artifacts/composition-order-${{ matrix.n }}-${{ matrix.strategy }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"n":%s,"strategy":"%s"}\n' \
              "${{ matrix.n }}" "${{ matrix.strategy }}" \
              >> artifacts/composition-order-${{ matrix.n }}-${{ matrix.strategy }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: composition-order-${{ matrix.n }}-${{ matrix.strategy }}
          path: artifacts/
