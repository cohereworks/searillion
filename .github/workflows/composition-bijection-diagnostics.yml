name: composition-bijection-diagnostics

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/composition_graft.py"
      - ".github/workflows/composition-bijection-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  row-boundary-nodes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: bijections, n: 5 }
          - { family: bijections, n: 6 }
          - { family: bijections, n: 7 }
          - { family: bijections, n: 8 }
          - { family: total-functions, n: 8 }
          - { family: bijection-identity, n: 8 }
          - { family: identity-bijection, n: 8 }
          - { family: function-bijection, n: 8 }
          - { family: bijection-function, n: 8 }

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Audited row-boundary diagnostic
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/composition_graft.py \
            --algorithm row-graft \
            --family ${{ matrix.family }} \
            --n ${{ matrix.n }} \
            --zdd-nodes \
            --output artifacts/bijection-${{ matrix.family }}-n${{ matrix.n }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"family":"%s","n":%s,"zdd_nodes_instrumented":true}\n' \
              "${{ matrix.family }}" "${{ matrix.n }}" \
              >> artifacts/bijection-${{ matrix.family }}-n${{ matrix.n }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: bijection-${{ matrix.family }}-n${{ matrix.n }}
          path: artifacts/
