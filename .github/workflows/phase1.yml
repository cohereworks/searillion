name: phase1-relations

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - ".github/workflows/phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relation-family:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size:
          - { left: 4, right: 4 }
          - { left: 8, right: 8 }
          - { left: 16, right: 16 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Measure relation power space
        run: |
          python experiments/relation_space.py             --left ${{ matrix.size.left }}             --right ${{ matrix.size.right }}             --output artifacts/relation-${{ matrix.size.left }}x${{ matrix.size.right }}.jsonl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relation-${{ matrix.size.left }}x${{ matrix.size.right }}
          path: artifacts/
