name: projection

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "experiments/projection.py"
      - ".github/workflows/projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: 8, forget: 1 }
          - { n: 8, forget: 8 }
          - { n: 12, forget: 1 }
          - { n: 12, forget: 12 }
          - { n: 16, forget: 1 }
          - { n: 16, forget: 16 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Projection benchmark
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/projection.py \
            --n ${{ matrix.n }} \
            --forget ${{ matrix.forget }} \
            --output artifacts/projection-${{ matrix.n }}-${{ matrix.forget }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"n":%s,"forgotten":%s}\n' \
              "${{ matrix.n }}" "${{ matrix.forget }}" \
              >> artifacts/projection-${{ matrix.n }}-${{ matrix.forget }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-${{ matrix.n }}-${{ matrix.forget }}
          path: artifacts/
