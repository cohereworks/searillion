name: function-frontier

on:
  pull_request:
    paths:
      - "experiments/function_ordering.py"
      - ".github/workflows/function-frontier.yml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [18, 19, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Probe locality-preserving frontier
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/function_ordering.py \
            --n ${{ matrix.n }} \
            --traversal as-is \
            --pair-order row-major \
            --output artifacts/frontier-${{ matrix.n }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"n":%s,"traversal":"as-is","pair_order":"row-major"}\n' \
              "${{ matrix.n }}" >> artifacts/frontier-${{ matrix.n }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-${{ matrix.n }}
          path: artifacts/
