name: joint-functions

on:
  pull_request:
    paths:
      - "src/**"
      - "experiments/joint_functions.py"
      - ".github/workflows/joint-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint-functions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [4, 8, 12, 16]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Joint function-family benchmark
        run: |
          mkdir -p artifacts
          set +e
          timeout 30s python experiments/joint_functions.py \
            --n ${{ matrix.n }} \
            --output artifacts/joint-functions-${{ matrix.n }}.jsonl
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            printf '{"classification":"resource_bound","reason":"timeout","timeout_seconds":30,"n":%s}\n' \
              "${{ matrix.n }}" >> artifacts/joint-functions-${{ matrix.n }}.jsonl
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-functions-${{ matrix.n }}
          path: artifacts/
